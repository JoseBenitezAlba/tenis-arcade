<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tenis Arcade</title>
<style>
:root{--u:clamp(6px,min(1vw,1.5vh),13px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a14;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#wrap{position:relative;width:min(100vw,calc((100vh - 4px)*1.5));aspect-ratio:3/2;background:#000;box-shadow:0 10px 60px #000a;border-radius:6px;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;z-index:20;overflow:auto;display:flex;background:radial-gradient(ellipse at center,#0f1c42f0,#04060ef5)}
.overlay.hidden{display:none}
.in{margin:auto;width:100%;max-width:920px;padding:18px;text-align:center}
h1{margin:0;font-size:max(34px,calc(var(--u)*7.5));line-height:1;letter-spacing:.04em;font-weight:900;font-style:italic;text-transform:uppercase;background:linear-gradient(#fff 30%,#ffd23f 70%,#ff8c1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px #000)}
h2{margin:0 0 .4em;font-size:max(18px,calc(var(--u)*2.4));font-style:italic;text-transform:uppercase;color:#ffd23f;letter-spacing:.06em}
.sub{margin:.6em 0 1.6em;font-size:max(11px,calc(var(--u)*1.5));letter-spacing:.3em;color:#9fb3e8;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.6em;margin:.5em 0;font-size:max(13px,calc(var(--u)*1.6))}
.row label{width:7em;text-align:right;color:#9fb3e8;text-transform:uppercase;letter-spacing:.12em;font-size:.85em}
.opt{font:inherit;font-size:max(13px,calc(var(--u)*1.6));font-weight:700;padding:.55em 1.2em;border-radius:3em;border:2px solid #3a4a80;background:#121b3a;color:#c9d6ff;cursor:pointer;min-width:6em}
.opt.on{background:linear-gradient(#ffd23f,#ff9a1f);color:#1a1200;border-color:#ffe38a;box-shadow:0 0 18px #ffb62e66}
.opt:hover{filter:brightness(1.15)}
.play{margin:.8em .3em 0;font:inherit;font-size:max(16px,calc(var(--u)*2.1));font-weight:900;font-style:italic;letter-spacing:.08em;padding:.55em 2em;border-radius:3em;border:0;background:linear-gradient(#5dff9a,#14c25e);color:#032312;cursor:pointer;box-shadow:0 5px 0 #0a7a3a,0 8px 24px #14c25e66;text-transform:uppercase}
.play.gold{background:linear-gradient(#ffe27a,#ffa622);color:#2a1700;box-shadow:0 5px 0 #a8620a,0 8px 24px #ffa62266}
.play:active{transform:translateY(3px)}
.keys{margin-top:1.8em;font-size:max(11px,calc(var(--u)*1.25));color:#8ea2d8;line-height:1.9}
.keys b{display:inline-block;min-width:2em;padding:.05em .55em;margin:0 .15em;border-radius:5px;background:#1b2750;border:1px solid #3a4a80;color:#fff;font-weight:700}
.res{font-size:max(16px,calc(var(--u)*2.8));font-weight:800;margin:.8em 0}
.panel{text-align:left;font-size:max(12px,calc(var(--u)*1.5))}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:.7em 1em;border-radius:12px;background:#0b1431;border:1px solid #2a3a70;margin-bottom:.8em}
.chead b{font-size:1.25em}.chead .rk{font-size:1.25em;font-weight:800;color:#ffd23f}
.card{padding:.9em 1em;border-radius:12px;background:linear-gradient(135deg,#142458,#0c1534);border:1px solid #33468a;margin-bottom:.8em}
.card .big{font-size:1.5em;font-weight:800;font-style:italic}
.badge{display:inline-block;padding:.1em .6em;border-radius:1em;font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-right:.4em;color:#111}
.t-C{background:#9fb3d9}.t-250{background:#7fe3a3}.t-500{background:#7ac7ff}.t-1000{background:#ffb35c}.t-GS{background:#ffd23f}.t-F{background:#e49bff}
.tabs{display:flex;gap:.5em;margin:.4em 0 .7em;flex-wrap:wrap}
.tabs .opt{min-width:0;padding:.4em 1em}
table{width:100%;border-collapse:collapse}
td,th{padding:.38em .6em;border-bottom:1px solid #22305f;text-align:left}
th{color:#8ea2d8;font-size:.8em;text-transform:uppercase;letter-spacing:.1em}
tr.me td{background:#ffd23f22;color:#ffe27a;font-weight:800}
tr.done td{color:#8ea2d8}tr.next td{background:#3a5cd422;font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:.8em;margin:.55em 0}
.stat .nm{width:7.5em;font-weight:700}.stat .bar{flex:1;height:.9em;background:#0a1028;border-radius:1em;border:1px solid #2a3a70;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#14c25e,#ffd23f)}
.stat .pm{width:2em;height:2em;border-radius:50%;border:0;background:#ffd23f;color:#111;font-weight:900;cursor:pointer}
.stat .pm:disabled{background:#2a3a70;color:#667;cursor:default}
.hint{color:#8ea2d8;font-size:.9em;margin:.3em 0}
.msg{padding:.7em 1em;border-radius:10px;background:#1c2d1a;border:1px solid #3f8a3a;margin-bottom:.8em;color:#cfffc9}
.msg.bad{background:#321a1a;border-color:#8a3a3a;color:#ffd0d0}
input.name{font:inherit;font-size:max(18px,calc(var(--u)*2.2));padding:.5em .8em;border-radius:10px;border:2px solid #3a4a80;background:#0b1431;color:#fff;text-align:center;width:min(380px,90%);margin:.6em 0;user-select:text;-webkit-user-select:text}
#touch{display:none;width:min(100vw,640px);padding:0 14px 8px;justify-content:space-between;align-items:center}
#pad{position:relative;width:128px;height:128px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30;touch-action:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:#ffffffaa}
.tb{width:84px;height:84px;border-radius:50%;border:2px solid #ffffff55;background:#ffd23f;color:#201600;font:800 15px system-ui;touch-action:none}
.tb.alt{background:#5db8ff;color:#001a2e}
.tb:active{filter:brightness(1.25);transform:scale(.95)}
#tbs{display:flex;gap:14px}
@media (pointer:coarse),(max-width:760px){#touch{display:flex}#app{justify-content:flex-start;padding-top:6px}#wrap{width:100vw}}
@media (max-width:760px){.keys{display:none}.row label{display:none}.in{padding:12px}}
</style>
</head>
<body>
<div id="app">
 <div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
 <div id="touch">
  <div id="pad"><div id="knob"></div></div>
  <div id="tbs"><button class="tb alt" id="bLob">GLOBO</button><button class="tb" id="bHit">GOLPE</button></div>
 </div>
</div>
<div id="menu" class="overlay"><div class="in">
  <h1>Tenis Arcade</h1>
  <div class="sub">Arcade de tenis · Tú contra el circuito</div>
  <div id="careerBtns"></div>
  <div class="sub" style="margin:1.4em 0 .4em">Partido rápido</div>
  <div class="row"><label>Pista</label><button class="opt on" data-k="surface" data-v="clay">Arcilla</button><button class="opt" data-k="surface" data-v="hard">Dura</button></div>
  <div class="row"><label>Rival</label><button class="opt" data-k="diff" data-v="0">Fácil</button><button class="opt on" data-k="diff" data-v="1">Normal</button><button class="opt" data-k="diff" data-v="2">Difícil</button></div>
  <div class="row"><label>Formato</label><button class="opt on" data-k="sets" data-v="1">1 set</button><button class="opt" data-k="sets" data-v="2">Mejor de 3</button></div>
  <button class="play" id="playBtn">▶ Partido rápido</button>
  <div class="keys"><b>←</b><b>→</b><b>↑</b><b>↓</b> o <b>W</b><b>A</b><b>S</b><b>D</b> mover &nbsp;·&nbsp; <b>ESPACIO</b> golpe / saque / smash &nbsp;·&nbsp; <b>Z</b> globo<br><b>↓</b>+golpe dejada &nbsp;·&nbsp; <b>P</b> pausa &nbsp;·&nbsp; <b>M</b> sonido &nbsp;·&nbsp; <b>ENTER</b> jugar</div>
</div></div>
<div id="career" class="overlay hidden"><div class="in panel" id="careerIn"></div></div>
<div id="over" class="overlay hidden"><div class="in"><h1 id="overT">Victoria</h1><div class="res" id="overR"></div><div id="overX"></div><button class="play" id="againBtn">↻ Revancha</button><br><button class="opt" id="menuBtn" style="margin-top:1em">Menú</button></div></div>
<div id="pause" class="overlay hidden"><div class="in"><h1>Pausa</h1><div class="sub">Pulsa P para continuar</div></div></div>
<script>
(()=>{
"use strict";
const W=960,H=640,L=23.77,NZ=L/2,G=19,BR=0.17,NET_H=0.95;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const CX=W/2,HY=82,CAMH=4.6,F=850,DD=9;
function P(x,y,z){const s=F/Math.max(z+DD,1.5);return{x:CX+x*s,y:HY+(CAMH-y)*s,s}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
function randn(){return (Math.random()+Math.random()+Math.random()-1.5)/0.75}
function seeded(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rnd2(R,a,b){return a+R()*(b-a)}
const $=id=>document.getElementById(id);
const cfg={surface:'clay',diff:1,sets:1};
const DIFF=[{name:'Fácil',speed:4.3,react:.45,err:.9,miss:.3},{name:'Normal',speed:5.6,react:.27,err:.5,miss:.15},{name:'Difícil',speed:6.8,react:.14,err:.28,miss:.06}];
let AIP=DIFF[1];                       // parámetros IA actuales
let PS={speed:7,T:1,err:1};            // estadísticas del jugador humano
let myName='TÚ',cpuName='CPU',cpuLabel='CPU · NORMAL',cpuLook=0,career=null; // career: contexto del partido de carrera
const THEMES={
 clay:{court:'#c4602f',court2:'#b95a2b',out:'#2c5e46',out2:'#1f4a37',line:'#f6f1e6'},
 hard:{court:'#2f6fb5',court2:'#2a65a8',out:'#1f7f5b',out2:'#176646',line:'#f4f6fa'}
};
// ---------- audio ----------
let AC=null,muted=false,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,dur,type='sine',vol=.2,slide=0,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,fq,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=fq;f.Q.value=.8;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur)}
const SFX={hit(p){noise(.09,.5*p,1800);tone(180,.09,'triangle',.25*p,-80)},bounce(v){noise(.06,.25*v,900);tone(120,.05,'sine',.12*v,-40)},net(){noise(.18,.3,500);tone(90,.2,'sine',.2,-40)},point(w){if(w){tone(523,.12,'square',.08);tone(659,.12,'square',.08,0,.1);tone(784,.2,'square',.08,0,.2)}else{tone(300,.2,'square',.07,-100);tone(220,.3,'square',.07,-60,.15)}},fault(){tone(200,.25,'sawtooth',.08,-60)},serve(){tone(700,.08,'sine',.08,300)},click(){tone(900,.04,'square',.05)}};
// ---------- state ----------
const ball={x:0,y:1,z:0,vx:0,vy:0,vz:0,bounces:0,last:-1,held:true,toss:false,tossT:0,inPlay:false,serving:true,hitId:0,trail:[]};
function mkPlayer(id,near){return{id,near,x:0,z:near?-.8:L+.8,vx:0,vz:0,tvx:0,tvz:0,swing:0,kind:'drive',cool:0,run:0,side:1,react:0,predFor:-1,tx:0,tz:0,flash:0,speed:0,want:'drive',wantT:0,kindRoll:.5}}
const pl=[mkPlayer(0,true),mkPlayer(1,false)];
const M={pts:[0,0],games:[0,0],sets:[0,0],server:0,setsToWin:1};
let mode='menu',state='serve',stateT=0,demo=true,serveFault=0,serveStage='ready',cpuServeAt=0,banner=null,pop=[],parts=[],shake=0,paused=false,hintT=9,time=0,matchOver=false,rallyHits=0;
const keys={};
const inp={x:0,y:0,hit:false,lob:false};
// ---------- static layer ----------
const statics={};
function buildStatic(theme){
 const T=THEMES[theme],c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 const R=seeded(7);
 const wallZ=L+5.2,wb=P(0,0,wallZ).y,wt=P(0,3.2,wallZ).y;
 let gr=g.createLinearGradient(0,0,0,wb);gr.addColorStop(0,'#05070f');gr.addColorStop(1,'#1b2347');g.fillStyle=gr;g.fillRect(0,0,W,wb);
 const pal=['#c94b4b','#e8d7a8','#4b78c9','#e0a13a','#7b5fc2','#d9d9e6','#3f9e7a','#2a2f55'];
 for(let row=0;row<20;row++){const y=wt-6-row*(wt/20)*0.98;for(let x=-10+R()*6;x<W+10;x+=7+R()*3){g.fillStyle=pal[(R()*pal.length)|0];g.globalAlpha=Math.max(.1,.35+R()*.45-row*.012);g.fillRect(x,y+R()*2,3.5,4)}}
 g.globalAlpha=1;
 gr=g.createLinearGradient(0,0,0,wt);gr.addColorStop(0,'#000b');gr.addColorStop(1,'#0000');g.fillStyle=gr;g.fillRect(0,0,W,wt);
 for(const lx of[140,480,820]){const rg=g.createRadialGradient(lx,0,2,lx,0,230);rg.addColorStop(0,'#fff6d8aa');rg.addColorStop(1,'#fff6d800');g.fillStyle=rg;g.fillRect(lx-240,0,480,240)}
 g.fillStyle='#0d1530';g.fillRect(0,wt,W,wb-wt);
 const names=['TENIS ARCADE','PRO TOUR','SAQUE','SMASH','ACE','MATCH POINT'],cols=['#143a8a','#a11d33','#0f6b52','#6a2a9a','#b36a00','#0b5d8f'];
 let i=0;for(let x=-24;x<24;x+=4.4,i++){const a=P(x,3.2,wallZ),b=P(x+4.2,0,wallZ);g.fillStyle=cols[i%cols.length];g.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);g.fillStyle='#ffffff22';g.fillRect(a.x,a.y,b.x-a.x,(b.y-a.y)*.12);g.fillStyle='#fff';g.font='italic 900 '+Math.max(8,(b.y-a.y)*.36)+'px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(names[i%names.length],(a.x+b.x)/2,(a.y+b.y)/2+1)}
 g.fillStyle='#000a';g.fillRect(0,wb-3,W,3);
 gr=g.createLinearGradient(0,wb,0,H);gr.addColorStop(0,T.out2);gr.addColorStop(1,T.out);g.fillStyle=gr;g.fillRect(0,wb,W,H-wb);
 const path=pts=>{g.beginPath();pts.forEach((p,k)=>{const q=P(p[0],0,p[1]);k?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)});g.closePath()};
 const poly=(pts,fill)=>{path(pts);g.fillStyle=fill;g.fill()};
 const X=7.2,Z0=-4,Z1=L+3.6;
 poly([[-X,Z0],[X,Z0],[X,Z1],[-X,Z1]],T.court);
 let k=0;for(let z=Z0;z<Z1;z+=1.4,k++){if(k%2)poly([[-X,z],[X,z],[X,Math.min(z+1.4,Z1)],[-X,Math.min(z+1.4,Z1)]],T.court2)}
 g.save();path([[-X,Z0],[X,Z0],[X,Z1],[-X,Z1]]);g.clip();
 for(let n=0;n<2600;n++){const q=P(rnd2(R,-X,X),0,rnd2(R,Z0,Z1));g.fillStyle=R()<.5?'#ffffff':'#000000';g.globalAlpha=.05+R()*.05;g.fillRect(q.x,q.y,Math.max(1,q.s*.04),Math.max(1,q.s*.03))}
 g.restore();g.globalAlpha=1;
 const lw=.07;
 const line=(x1,z1,x2,z2,w=lw)=>{const dx=x2-x1,dz=z2-z1,l=Math.hypot(dx,dz),nx=-dz/l*w/2,nz=dx/l*w/2;poly([[x1+nx,z1+nz],[x2+nx,z2+nz],[x2-nx,z2-nz],[x1-nx,z1-nz]],T.line)};
 g.globalAlpha=.96;
 line(-5.49,0,5.49,0);line(-5.49,L,5.49,L);line(-4.11,0,-4.11,L);line(4.11,0,4.11,L);line(-5.49,0,-5.49,L);line(5.49,0,5.49,L);
 line(-4.11,NZ-6.4,4.11,NZ-6.4);line(-4.11,NZ+6.4,4.11,NZ+6.4);line(0,NZ-6.4,0,NZ+6.4);line(0,0,0,.3);line(0,L,0,L-.3);
 g.globalAlpha=1;
 return c;
}
// ---------- particles / popups ----------
function dust(x,z,n,sp=1,col){const T=THEMES[cfg.surface];for(let i=0;i<n;i++)parts.push({x:x+rnd(-.1,.1),y:.05,z,vx:rnd(-1,1)*sp*1.5,vy:rnd(.5,2.2)*sp,vz:rnd(-1,1)*sp*1.5,life:rnd(.3,.6),max:.6,col:col||T.court2,r:rnd(.03,.07)})}
function spark(x,y,z,n){for(let i=0;i<n;i++)parts.push({x,y,z,vx:rnd(-2,2),vy:rnd(-1,3),vz:rnd(-2,2),life:rnd(.15,.3),max:.3,col:'#fff6b0',r:.035})}
function setBanner(t,sub,dur=1.5,col='#fff'){banner={t,sub,dur,age:0,col}}
// ---------- match flow ----------
function resetMatch(){M.pts=[0,0];M.games=[0,0];M.sets=[0,0];M.server=0;M.setsToWin=cfg.sets;matchOver=false}
function startPoint(){state='serve';stateT=0;serveFault=0;prepServe()}
function prepServe(){
 const srv=pl[M.server],rec=pl[1-M.server];
 const sgn=((M.pts[0]+M.pts[1])%2)===0?1:-1,near=srv.near;
 srv.x=near?1.4*sgn:-1.4*sgn;srv.z=near?-.9:L+.9;srv.vx=srv.vz=0;srv.swing=0;
 rec.x=near?-2.5*sgn:2.5*sgn;rec.z=near?L+.6:-.6;rec.vx=rec.vz=0;rec.swing=0;rec.predFor=-1;
 resetServeBall();rallyHits=0;
}
function resetServeBall(){
 const srv=pl[M.server];
 Object.assign(ball,{held:true,toss:false,tossT:0,inPlay:false,serving:true,bounces:0,last:-1,vx:0,vy:0,vz:0,trail:[]});
 serveStage='ready';cpuServeAt=(srv.id===1||demo)?time+1.1+rnd(0,.6):0;
}
function awardPoint(w,why,sub){
 if(state==='point'||state==='over')return;
 state='point';stateT=0;ball.inPlay=false;
 M.pts[w]++;let txt=why,sb=sub||'';
 if(!demo)SFX.point(w===0);
 if(M.pts[w]>=4){
  M.games[w]++;M.pts=[0,0];M.server=1-M.server;
  if(M.games[w]>=4){M.sets[w]++;M.games=[0,0];txt='SET';sb=(w===0?'Para ti':'Para '+cpuName);
   if(M.sets[w]>=M.setsToWin){matchOver=true;sb=''}}
  else{txt='JUEGO';sb=(w===0?'Para ti':'Para '+cpuName)}
 }else if(M.pts[0]===3&&M.pts[1]===3){sb='40-40 · punto de oro'}
 if(!demo)setBanner(txt,sb,1.9,w===0?'#7dffa8':'#ff9c9c');
 serveFault=0;
}
function fault(why){
 if(state!=='serve')return;
 serveFault++;
 if(serveFault>=2){const w=1-M.server;if(!demo)SFX.fault();awardPoint(w,'DOBLE FALTA','');return}
 if(!demo){SFX.fault();setBanner('FALTA',why||'',1.1,'#ffd23f')}
 ball.inPlay=false;resetServeBall();
}
// ---------- ball physics ----------
function launch(tx,tz,T,y0){
 let vx,vy,vz,n=0;
 for(;;){
  vx=(tx-ball.x)/T;vz=(tz-ball.z)/T;vy=(.5*G*T*T-y0)/T;
  const tn=(NZ-ball.z)/vz;let yn=9;if(tn>0&&tn<T)yn=y0+vy*tn-.5*G*tn*tn;
  if(yn>=1.3||n++>14)break;T*=1.07;
 }
 ball.vx=vx;ball.vy=vy;ball.vz=vz;ball.y=Math.max(y0,.35);
}
function doHit(e,kind,ai){
 const opp=pl[1-e.id],dir=e.near?1:-1;
 const dx=Math.abs(ball.x-e.x),dz=Math.abs(ball.z-e.z);
 const stretch=Math.max(0,dx-.8)+Math.max(0,dz-.8);

function padMove(ev){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(ev.clientX-cx)/(r.width/2),dy=(ev.clientY-cy)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}tpad.x=Math.abs(dx)<.15?0:dx;tpad.y=Math.abs(dy)<.15?0:-dy;knob.style.transform='translate('+dx*38+'px,'+dy*38+'px)';recalc()}
pad.addEventListener('pointerdown',e=>{audioInit();tpad.active=true;pad.setPointerCapture(e.pointerId);padMove(e)});
pad.addEventListener('pointermove',e=>{if(tpad.active)padMove(e)});
const padEnd=()=>{tpad.active=false;tpad.x=tpad.y=0;knob.style.transform='';recalc()};
pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
$('bHit').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(mode==='play')inp.hit=true});
$('bLob').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(mode==='play')inp.lob=true});
// ---------- loop ----------
let last=performance.now(),acc=0;
function frame(t){
 const dt=Math.min(.25,(t-last)/1000);last=t;
 if(!paused){acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}}
 render();requestAnimationFrame(frame);
}
cpuLook=2;resetMatch();startPoint();refreshCareerButtons();
window.__game={ball,pl,M,cfg,keys,inp,get state(){return state},get mode(){return mode},get serveStage(){return serveStage},get demo(){return demo},get rallyHits(){return rallyHits},get C(){return C},force:(w)=>{M.sets[w]=M.setsToWin;matchOver=true;state="point";stateT=3}};
requestAnimationFrame(frame);
})();
</script>
